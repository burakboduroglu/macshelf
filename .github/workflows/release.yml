name: Release

on:
  push:
    tags: ["v*"]
  # A manual run packages the DMG as a workflow artefact without publishing,
  # so the packaging path can be exercised off a tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          xcode-select -p
          swift --version

      # The DMG carries the version from Info.plist, so a tag that runs ahead
      # of the bump would publish a mislabelled build under the right name.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Sources/MacShelf/Resources/Info.plist)
          echo "tag=$tag plist=$plist"
          test "$tag" = "$plist"

      - name: Collect the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # scripts/package-dmg.sh builds the bundle first. Finder styling is
      # attempted and gives up after its watchdog rather than hanging here.
      - name: Package the DMG
        run: scripts/package-dmg.sh

      - name: Verify the bundle
        run: |
          test -x build/MacShelf.app/Contents/MacOS/MacShelf
          plutil -lint build/MacShelf.app/Contents/Info.plist
          codesign --verify --deep --strict build/MacShelf.app
          test -f build/MacShelf.app/Contents/Resources/MacShelf.icns

      - name: Name the artefacts
        id: artefacts
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Sources/MacShelf/Resources/Info.plist)
          dmg="dist/MacShelf-${version}.dmg"
          test -f "$dmg"
          {
            echo "version=$version"
            echo "dmg=$dmg"
            echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the DMG mounts and the app inside it is signed
        run: |
          hdiutil attach "${{ steps.artefacts.outputs.dmg }}" \
            -nobrowse -noautoopen -mountpoint /tmp/macshelf-verify >/dev/null
          test -d /tmp/macshelf-verify/MacShelf.app
          codesign --verify --deep --strict /tmp/macshelf-verify/MacShelf.app
          hdiutil detach /tmp/macshelf-verify -quiet

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artefacts.outputs.dmg }}" \
            "${{ steps.artefacts.outputs.dmg }}.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"

      - name: Upload the dry-run DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MacShelf-${{ steps.artefacts.outputs.version }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # The cask lives in burakboduroglu/homebrew-macshelf and pins the
      # checksum, so print the two lines that have to change there.
      - name: Show the Homebrew cask update
        run: |
          {
            echo '## Homebrew cask'
            echo
            echo 'Update `Casks/macshelf.rb` in `burakboduroglu/homebrew-macshelf`:'
            echo
            echo '```ruby'
            echo '  version "${{ steps.artefacts.outputs.version }}"'
            echo '  sha256 "${{ steps.artefacts.outputs.sha256 }}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
